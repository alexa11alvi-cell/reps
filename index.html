<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Clínica Salud - Sistema de Gestión Hospitalaria</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
body{background:linear-gradient(135deg,#f0f4f8 0%,#ffffff 100%);color:#2d3748;min-height:100vh}
header{background:linear-gradient(90deg,#0b6fb8 0%,#00a6d6 100%);color:#fff;padding:25px 20px;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.header-container{max-width:1300px;margin:auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px}
.logo{font-size:32px;font-weight:800}
.tagline{font-size:14px;opacity:.9;margin-top:5px}
.btn{border:none;padding:12px 22px;border-radius:12px;cursor:pointer;font-weight:700;transition:.3s}
.btn:hover{transform:translateY(-3px)}
.btn-primary{background:#fff;color:#0b6fb8}
.btn-accent{background:#18a857;color:#fff}
.btn-danger{background:#e53e3e;color:#fff}
.container{max-width:1300px;margin:30px auto;padding:0 20px}
.card{background:#fff;padding:30px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.05);margin-bottom:30px}
.table-wrapper{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:20px}
th{background:#f8fafc;padding:18px;color:#4a5568;font-size:13px;border-bottom:2px solid #edf2f7}
td{padding:18px;text-align:center;border-bottom:1px solid #edf2f7}
tr:hover{background:#f9fbff}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);justify-content:center;align-items:center;z-index:1000}
.login-card{background:#a4b8a5;width:100%;max-width:450px;padding:40px;border-radius:24px;text-align:center}
.input-group{margin-bottom:15px}
input,select,textarea{width:100%;padding:14px;border-radius:10px;border:1px solid #cbd5e0}
#paginaReserva{display:none;min-height:100vh;background:#1a202c;padding:50px 20px}
.reserva-box{max-width:800px;margin:auto;background:#4a5568;padding:40px;border-radius:20px;color:white}
.reserva-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
footer{text-align:center;padding:40px;color:#a0aec0}
</style>
</head>
<body>

<div id="inicio">

<header>
<div class="header-container">

<div>
<div class="logo">CLÍNICA SALUD</div>
<div class="tagline">Ayacucho • Innovación Médica</div>
</div>

<div style="display:flex;gap:15px;">
<button class="btn btn-accent" onclick="emitirBoleta()">EMITIR BOLETA</button>
<button class="btn btn-primary" onclick="abrirLogin()">INGRESA USUARIO</button>
</div>

</div>
</header>

<div class="container">

<div class="card">
<div style="display:flex;gap:15px;align-items:center;flex-wrap:wrap;">
<label><strong>Fecha Programada:</strong></label>
<input type="date" id="fechaCita" style="width:250px;">
<button class="btn btn-primary" onclick="cargarTabla()">PERSONAS REGISTRADAS</button>
</div>
</div>

<div class="card">
<h2 style="color:#0b6fb8;">Agenda de Consultorios</h2>
<div class="table-wrapper">
<table id="tablaEspecialidades"></table>
</div>
</div>

</div>

<footer>© 2026 Clínica Salud</footer>
</div>

<!-- LOGIN -->
<div class="modal" id="modalLogin">
<div class="login-card">

<h2 style="color:white;margin-bottom:25px;">Iniciar Sesión</h2>

<div class="input-group">
<select id="tipoUsuario">
<option value="ADMINISTRADOR">ADMINISTRADOR</option>
<option value="MÉDICO">MÉDICO</option>
<option value="CAJERO">CAJERO</option>
</select>
</div>

<div class="input-group">
<input type="text" placeholder="Usuario">
</div>

<div class="input-group">
<input type="password" placeholder="Contraseña">
</div>

<button class="btn" style="width:100%;background:white;color:#333;" onclick="ingresar()">ACCEDER</button>
<button class="btn btn-danger" style="width:100%;margin-top:10px;" onclick="cerrarLogin()">VOLVER</button>

</div>
</div>

<!-- REGISTRO -->
<div id="paginaReserva">
<div class="reserva-box">

<h2 style="text-align:center;font-size:30px;">REGISTRO DE PACIENTE</h2>

<div class="reserva-grid">

<div>
<label>Especialidad</label>
<input id="rEspecialidad" readonly>
</div>

<div>
<label>Fecha</label>
<input id="rFecha" readonly>
</div>

<div>
<label>Nombre</label>
<input id="rNombre">
</div>

<div>
<label>DNI</label>
<input id="rDni">
</div>

</div>

<div style="margin-top:20px;">
<label>Motivo</label>
<textarea id="rMotivo" rows="3"></textarea>
</div>

<div style="display:flex;justify-content:center;gap:20px;margin-top:35px;">
<button class="btn btn-accent" onclick="guardarReserva()">CONFIRMAR</button>
<button class="btn btn-danger" onclick="cerrarReserva()">CANCELAR</button>
</div>

</div>
</div>

<script>
let especialidades = [
{id:1,nombre:"MEDICINA GENERAL",max:15},
{id:2,nombre:"ODONTOLOGÍA",max:10},
{id:3,nombre:"PEDIATRÍA",max:12},
{id:4,nombre:"OBSTETRICIA",max:8},
{id:5,nombre:"CARDIOLOGÍA",max:6},
{id:6,nombre:"DERMATOLOGÍA",max:5}
];

let citas = JSON.parse(localStorage.getItem("citasClinica")) || [];
let usuarioActual = "";
let ventanaAdmin;
let espSeleccionada = "";

/* GUARDAR */
function guardarDatos(){
localStorage.setItem("citasClinica", JSON.stringify(citas));
}

/* TABLA */
function cargarTabla(){

let tabla = document.getElementById("tablaEspecialidades");

let html = `
<tr>
<th>ITEM</th>
<th>ESPECIALIDAD</th>
<th>CAPACIDAD</th>
<th>PERSONAS REGISTRADAS</th>
<th>LIBRES</th>
<th>ACCIONES</th>
</tr>
`;

especialidades.forEach(e=>{

let registrados = citas.filter(c=>c.especialidad===e.nombre).length;
let libres = e.max - registrados;

let botones = "";

if(libres>0){
botones += `<button class="btn btn-accent" onclick="abrirReserva('${e.nombre}')">SEPARAR CITA</button>`;
}else{
botones += `<button class="btn btn-danger">LLENO</button>`;
}

if(usuarioActual==="ADMINISTRADOR"){
botones += ` <button class="btn btn-danger" onclick="borrarCitasEspecialidad('${e.nombre}')">BORRAR CITAS</button>`;
}

html += `
<tr>
<td>${e.id}</td>
<td style="text-align:left;font-weight:bold;">${e.nombre}</td>
<td>${e.max}</td>
<td>${registrados}</td>
<td>${libres}</td>
<td>${botones}</td>
</tr>
`;

});

tabla.innerHTML = html;
}

window.onload = cargarTabla;

/* RESERVA */
function abrirReserva(nombre){
espSeleccionada = nombre;
document.getElementById("inicio").style.display="none";
document.getElementById("paginaReserva").style.display="block";
document.getElementById("rEspecialidad").value = nombre;
document.getElementById("rFecha").value = document.getElementById("fechaCita").value;
}

function cerrarReserva(){
document.getElementById("paginaReserva").style.display="none";
document.getElementById("inicio").style.display="block";
}

function guardarReserva(){

let nombre = document.getElementById("rNombre").value.trim();
let dni = document.getElementById("rDni").value.trim();
let motivo = document.getElementById("rMotivo").value.trim();

if(nombre=="" || dni==""){
alert("Complete datos.");
return;
}

citas.push({
id:Date.now(),
paciente:nombre.toUpperCase(),
dni:dni,
motivo:motivo,
especialidad:espSeleccionada,
fecha:document.getElementById("rFecha").value,
estado:"PENDIENTE"
});

guardarDatos();
alert("Registro guardado.");

document.getElementById("rNombre").value="";
document.getElementById("rDni").value="";
document.getElementById("rMotivo").value="";

cerrarReserva();
cargarTabla();
}

/* LOGIN */
function abrirLogin(){
document.getElementById("modalLogin").style.display="flex";
}

function cerrarLogin(){
document.getElementById("modalLogin").style.display="none";
}

function ingresar(){
usuarioActual = document.getElementById("tipoUsuario").value;
cerrarLogin();
cargarTabla();

ventanaAdmin = window.open("","_blank");
renderizarPanel(usuarioActual);
}

/* PANEL */
function renderizarPanel(rol){

let filas = "";

citas.forEach((c,i)=>{
filas += `
<tr>
<td>${i+1}</td>
<td>${c.paciente}</td>
<td>${c.dni}</td>
<td>${c.especialidad}</td>
<td>${c.fecha}</td>
<td>${c.estado}</td>
<td><button onclick="window.opener.eliminarCita(${c.id})">BORRAR</button></td>
</tr>
`;
});

if(citas.length==0){
filas = `<tr><td colspan="7">No hay personas registradas</td></tr>`;
}

ventanaAdmin.document.write(`
<html>
<head>
<style>
body{font-family:Segoe UI;padding:30px;background:#f4f7fa}
.box{background:white;padding:30px;border-radius:20px}
table{width:100%;border-collapse:collapse}
th{background:#0b6fb8;color:white;padding:12px}
td{padding:12px;border-bottom:1px solid #ddd;text-align:center}
button{padding:8px 12px}
</style>
</head>
<body>
<div class="box">
<h1>PERSONAS REGISTRADAS - ${rol}</h1>

<table>
<tr>
<th>N°</th>
<th>NOMBRE</th>
<th>DNI</th>
<th>ESPECIALIDAD</th>
<th>FECHA</th>
<th>ESTADO</th>
<th>ACCIONES</th>
</tr>
${filas}
</table>

<br>
<button onclick="window.close()">CERRAR</button>

</div>
</body>
</html>
`);
ventanaAdmin.document.close();
}

/* BORRAR UNO */
window.eliminarCita = function(id){

if(!confirm("¿Eliminar registro?")) return;

citas = citas.filter(c=>c.id!=id);
guardarDatos();
cargarTabla();
renderizarPanel(usuarioActual);
}

/* BORRAR TODOS */
function borrarCitasEspecialidad(nombre){

if(usuarioActual!=="ADMINISTRADOR"){
alert("Solo administrador");
return;
}

if(!confirm("¿Borrar citas de "+nombre+"?")) return;

citas = citas.filter(c=>c.especialidad!==nombre);

guardarDatos();
cargarTabla();

alert("Registros eliminados.");
}

/* BOLETA */
function emitirBoleta(){

let v = window.open("","_blank","width=400,height=500");

v.document.write(`
<body style="font-family:monospace;padding:20px;">
<center>
<h2>CLÍNICA SALUD</h2>
<hr>
<h3>BOLETA</h3>
<p>${new Date().toLocaleDateString()}</p>
</center>

<p>Consulta Médica</p>
<p>Total: S/ 60.00</p>

<center>
<button onclick="window.print()">IMPRIMIR</button>
</center>
</body>
`);
}
</script>

</body>
</html>
